# XcodeGen spec. Generate the project with:  cd ios && xcodegen generate
# The generated Messenger.xcodeproj is not committed (see .gitignore).
name: Messenger

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Development: debug
  Staging: release
  Production: release

configFiles:
  Development: Config/Development.xcconfig
  Staging: Config/Staging.xcconfig
  Production: Config/Production.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only

packages:
  MessengerKit:
    path: Packages/MessengerKit

targets:
  Messenger:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: MessengerKit
        products: [Domain, Networking, UI]
      - target: NotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSFaceIDUsageDescription: "Face ID is used to unlock the app when App Lock is enabled."
        NSMicrophoneUsageDescription: "The microphone is used to record voice messages."
        NSCameraUsageDescription: "The camera is used to take photos and videos to send."
        NSPhotoLibraryAddUsageDescription: "Photos you choose to save are added to your library."
        # Server configuration (values come from Config/*.xcconfig; never hardcoded in Swift)
        MessengerXMPPDomain: $(XMPP_DOMAIN)
        MessengerXMPPHost: $(XMPP_HOST)
        MessengerXMPPPort: $(XMPP_PORT)
        MessengerMUCDomain: $(MUC_DOMAIN)
        MessengerPushComponentJID: $(PUSH_COMPONENT_JID)
        MessengerAppGroup: $(APP_GROUP_ID)
        # ITSAppUsesNonExemptEncryption: set after the export-compliance review (docs/08, R10)
    entitlements:
      path: App/Messenger.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)]

  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notification-service
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)]

schemes:
  Messenger:
    build:
      targets:
        Messenger: all
    run:
      config: Development
    archive:
      config: Production
