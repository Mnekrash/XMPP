# XcodeGen spec. Generate the project with:  cd ios && xcodegen generate
# The generated Messenger.xcodeproj is not committed (see .gitignore).
# Personal values (Team ID, bundle id prefix, server) go into Config/Local.xcconfig (copy Local.xcconfig.example).
name: Messenger

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru

configs:
  Development: debug
  Staging: release
  Production: release

configFiles:
  Development: Config/Development.xcconfig
  Staging: Config/Staging.xcconfig
  Production: Config/Production.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  MessengerKit:
    path: Packages/MessengerKit

targets:
  Messenger:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MessengerKit
        products: [Domain, Networking, AppSecurity, XMPPTransport, Authentication, UI]
      - target: NotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSFaceIDUsageDescription: "Face ID используется для разблокировки приложения, если включена блокировка."
        NSMicrophoneUsageDescription: "Микрофон нужен для записи голосовых сообщений."
        NSCameraUsageDescription: "Камера нужна, чтобы снимать и отправлять фото и видео."
        NSPhotoLibraryAddUsageDescription: "Сохранённые вами фото добавляются в медиатеку."
        NSLocalNetworkUsageDescription: "Нужно только для подключения к тестовому серверу в локальной сети."
        ITSAppUsesNonExemptEncryption: false   # development builds only; set after the export-compliance review
        # Server configuration (values come from Config/*.xcconfig; never hardcoded in Swift)
        MessengerXMPPDomain: $(XMPP_DOMAIN)
        MessengerXMPPHost: $(XMPP_HOST)
        MessengerXMPPPort: $(XMPP_PORT)
        MessengerMUCDomain: $(MUC_DOMAIN)
        MessengerPushComponentJID: $(PUSH_COMPONENT_JID)
        MessengerAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: App/Messenger.entitlements
      properties:
        # Push is needed from S2 on; Xcode's automatic signing enables the capability on the App ID.
        # App Group / Keychain sharing are added together with the NSE work (S2), not needed for login.
        aps-environment: $(APS_ENVIRONMENT)

  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notification-service
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  MessengerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Messenger
      - package: MessengerKit
        products: [AppSecurity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Messenger:
    build:
      targets:
        Messenger: all
    run:
      config: Development
    test:
      config: Development
      targets: [MessengerTests]
    archive:
      config: Production
