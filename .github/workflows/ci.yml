name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-smoke:
    name: Server stack smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create development .env with random secrets
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^XMPP_DOMAIN=.*/XMPP_DOMAIN=chat.messenger.test/; s/^UPLOAD_DOMAIN=.*/UPLOAD_DOMAIN=upload.messenger.test/' deploy/.env
          for key in POSTGRES_PASSWORD EJABBERD_DB_PASSWORD PUSH_DB_PASSWORD PUSH_COMPONENT_SECRET; do
            sed -i "s/^$key=.*/$key=$(openssl rand -hex 24)/" deploy/.env
          done
      - name: Run end-to-end smoke test
        run: scripts/dev-smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color

  push-gateway:
    name: Push gateway (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: push/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh server/postgres/init/*.sh server/cert-sync/*.sh

  ios:
    name: iOS app, NSE and unit tests (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in sorted(d.items(), reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: MessengerKit unit tests on the iOS simulator (Domain, Networking, Authentication, transport)
        working-directory: ios/Packages/MessengerKit
        run: |
          xcodebuild test -scheme MessengerKit-Package -destination "id=$SIM_UDID" -skipPackagePluginValidation \
            | tee "$RUNNER_TEMP/unit.log" | grep -E "Test (Suite|Case)|✔|✘|passed|failed|error:" | tail -80
          test "${PIPESTATUS[0]}" -eq 0
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build app + Notification Service Extension and run the app-hosted Keychain tests (simulator, ad-hoc signed)
        run: |
          # The Keychain needs a signed host app; ad-hoc signing ("-") needs no team on the simulator.
          xcodebuild test -project ios/Messenger.xcodeproj -scheme Messenger -configuration Development \
            -destination "id=$SIM_UDID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee "$RUNNER_TEMP/app.log" | grep -E "✔|✘|passed|failed|error:" | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Development-iphonesimulator/Messenger Dev.app" -maxdepth 6 | head -1)
          test -d "$APP/PlugIns/NotificationService.appex" && echo "NSE embedded: $APP/PlugIns/NotificationService.appex"
      - name: Build app for a physical iPhone (generic device, unsigned)
        run: |
          xcodebuild -project ios/Messenger.xcodeproj -scheme Messenger -configuration Development \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -5
          test "${PIPESTATUS[0]}" -eq 0

  ios-integration:
    name: Martin transport against a real ejabberd (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install ejabberd
        run: brew install ejabberd
      - name: Start ejabberd with a CI CA and test accounts
        run: .github/scripts/ejabberd-macos.sh
      - name: Integration tests (login, wrong password, disabled account, temporary password flow, restore)
        run: swift test --package-path ios/Packages/MessengerKit --filter "IntegrationTests|AuthenticationTests|XMPPTransportTests"
      - name: ejabberd log
        if: failure()
        run: tail -100 "$(brew --prefix)/var/log/ejabberd/ejabberd.log" || true
